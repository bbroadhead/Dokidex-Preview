name: Install supplied Yano monster data and sprites
on:
  push:
    branches: [feature/yami-kids-nuumonsters-dex]
    paths: [yano.zip]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/yami-kids-nuumonsters-dex
      - name: Validate and unpack supplied archive
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path('yano.zip')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in names)
              assert any(n.startswith('yano/yami-kids/') for n in names)
              assert any(n.startswith('yano/nuumonsters/') for n in names)
              z.extractall('.')
          p.unlink()
          PY
      - name: Commit data and sprite files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yano yano.zip
          git diff --cached --quiet || (git commit -m "Install original Yami Kids and Nuumonsters data and sprites" && git push)
